
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Music Library</title>

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Axios -->
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div id="app">
        <input class="form-control mb-3" v-model="username" placeholder="Username">
        <input class="form-control mb-3" v-model="password" type="password" placeholder="Password">
        <button class="btn btn-primary" v-on:click="login">Login</button>
        <button class="btn btn-danger" v-if="Role !== ''" @click="logout">Logout</button>

        <!-- Main container -->
        <div class="container py-5">

            <!-- Page heading -->
            <div class="mb-4">
                <h1 class="display-5 fw-bold">DR Music Library</h1>
                <p class="text-muted">
                    Welcome to the music record administration system.
                </p>
            </div>

            <!-- Music records card -->
            <div class="card shadow-sm">

                <div class="card-body">

                    <input
                        type="text"
                        class="form-control mb-3"
                        id="search-title"
                        placeholder="Search by title"
                        v-model="searchTitle">

                    <input
                        type="text"
                        class="form-control mb-3"
                        id="search-artist"
                        placeholder="Search by artist"
                        v-model="searchArtist">

                    <input
                        type="text"
                        class="form-control mb-3"
                        id="search-genre"
                        placeholder="Search by genre"
                        v-model="searchGenre">
                    
                    <input
                        type="number"
                        class="form-control mb-3"
                        id="search-year"
                        placeholder="Search by year"
                        v-model.number="searchYear">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h2 class="h4 mb-0">Music Records</h2>

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="get-records-btn"
                            @click="getAllRecords">
                            Get Music Records
                        </button>

                    </div>

                    <!-- Records table -->
                    <div class="table-responsive" v-if="records.length > 0">

                        <table class="table table-striped table-hover" id="recordsTable">

                            <thead class="table-dark">
                                <tr>
                                    <th>Title</th>
                                    <th>Artist</th>
                                    <th>Year</th>
                                    <th>Genre</th>
                                    <th>Duration</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr v-for="record in records" :key="record.id">
                                    <td>{{ record.title }}</td>
                                    <td>{{ record.artist }}</td>
                                    <td>{{ record.year }}</td>
                                    <td>{{ record.genre }}</td>
                                    <td>{{ record.duration }} seconds</td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                    <!-- Empty message -->
                    <div v-else class="alert alert-info mb-0">
                        No music records available. Click the button to load records.
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Your Vue JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
